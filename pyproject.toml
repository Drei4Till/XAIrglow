[project]
name = "xairglow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pydantic>=2",
    "numpy",
    "h5py",
    "tqdm",
    "opencv-python-headless",
    "scipy",
    "pillow",
]

[dependency-groups]
notebooks = ["matplotlib", "scikit-image", "scikit-spatial", "ipykernel"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]